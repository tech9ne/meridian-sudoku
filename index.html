body{background:var(--sd-page)!important;color:var(--sd-text)!important;margin:0;padding:.75rem!important}
#root{max-width:760px;margin:0 auto}
.sd-title{display:none!important}
.theme-switcher{position:static;margin:0 0 .5rem auto;width:max-content;display:flex;gap:.35rem;background:var(--sd-cell);border:1px solid var(--color-line);padding:.35rem;border-radius:999px}
.theme-switcher button{width:20px;height:20px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.25);text-indent:-9999px;overflow:hidden;cursor:pointer}
.theme-switcher button[data-theme="meridian"]{background:#FAAD14}
.theme-switcher button[data-theme="midnight"]{background:#38BDF8}
.theme-switcher button[data-theme="forest"]{background:#A3E635}
.theme-switcher button[data-theme="sepia"]{background:#F59E0B}
.theme-switcher button[data-theme="hodoku"]{background:#FFFFFF;border-color:#9E9E9E}
:root[data-theme="hodoku"] .sd-cell{font-family:Arial,Helvetica,sans-serif}
:root[data-theme="hodoku"] .text-gray-200,:root[data-theme="hodoku"] .text-gray-300,:root[data-theme="hodoku"] .text-gray-400,:root[data-theme="hodoku"] .text-gray-500{color:#1A1A1A}
.theme-switcher button.active{outline:2px solid var(--sd-text);outline-offset:1px}

@media (max-width:640px){
  body{padding:.5rem!important}
  #root>div{gap:.6rem!important}
  .sd-grade{font-size:.62rem!important}
  .sd-diff button{padding:.35rem .6rem!important;font-size:.6rem!important}
  .sd-tools > button{width:2.4rem!important;height:2.4rem!important}
  .sd-mode{padding:.3rem .7rem!important;font-size:.62rem!important}
  .sd-pad button:not(.sd-erase){width:2.1rem!important;height:2.4rem!important;font-size:.85rem!important}
  .sd-erase{width:auto!important;height:2.4rem!important;padding:0 .6rem!important;font-size:.6rem!important}
}
